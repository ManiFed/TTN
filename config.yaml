aavso:
  audit_dir: aavso_submissions
  chart_id: ''
  observer_code: EGBA
  password: ${AAVSO_PASSWORD}
  submit_from_node: false
  submit_poor_quality: false
  username: ${AAVSO_USERNAME}
alpaca:
  api_version: 1
  default_server:
    address: ''          # left blank: auto-discovered from Seestar Station Mode
    port: 32323
  discovery_port: 32227
  discovery_timeout: 8
autofocus:
  exposure_s: 2
  max_position: null
  min_position: null
  samples_per_point: 1
  settle_s: 1
  step_size: 50
  steps_per_side: 5
camera:
  binning: 1
  exposure_duration: 30
centering:
  exposure_s: 3
  max_iterations: 4
  settle_s: 2
  tolerance_arcmin: 3
cloud:
  api_key: ''
  auto_run_plans: true
  disconnect_park_timeout: 1800
  enabled: true
  heartbeat_interval: 60
  heartbeat_fast_interval: 5
  node_id: ''
  plan_poll_interval: 300
  realtime_url: https://realtime.thetelescope.net
  upload_images: false
  url: https://api.thetelescope.net
autonomy:
  enabled: false
  public_keys: {}
  outbox_max_bytes: 2147483648
  max_bundle_storage_bytes: 21474836480
commissioning:
  enabled: true
  interval_s: 10
devices:
  camera:
    device_number: 0
    enabled: true
  covercalibrator:
    device_number: 0
    enabled: true
  filterwheel:
    device_number: 0
    enabled: false
  focuser:
    device_number: 0
    enabled: false
  telescope:
    device_number: 0
    enabled: true
image_watcher:
  debounce_delay: 2
  enabled: true
  watch_path: /mnt/seestar
logging:
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
  level: INFO
observatory:
  elevation: 525
  instrument: ZWO Seestar S50 IMX462
  latitude: 31.3614
  longitude: -99.4431
  name: Starfront Observatories, Rockwood TX
  observer: ''
  telescope: ZWO Seestar S50
photometry:
  annulus_inner: 4
  annulus_outer: 6
  aperture_factor: 1.5
  astap_path: astap
  astap_search_radius: 10
  # BJD is stamped at mid-exposure (DATE-OBS + EXPTIME/2, FITS convention).
  # Set false for devices whose DATE-OBS is already the mid- or end-point.
  bjd_midpoint_correction: true
  comparison_catalogs:
  - aavso
  - apass
  - gaia
  # Frozen local JSON catalog for the "file" comparison backend (offline /
  # reproducible validation runs).  See docs/validation/FIXTURE_MANIFEST.md
  comparison_star_file: ''
  comparison_target_count: 8
  enabled: true
  field_radius: 0.5
  filter_name: CV
  fits_export:
    enabled: true
    export_dir: fits_export
  force_plate_solve: true
  fwhm_fallback_px: 4.01
  gain: 1
  # Increment after any response-changing hardware characterization update.
  hardware_characterization_version: '1'
  mag_limit: 15
  mag_min: 10
  max_airmass: 3
  max_exposure_s: 30
  max_uncertainty: 0.3
  min_comparison_stars: 3
  node_id: seestar-live-001
  pixel_scale: 2.4
  read_noise: 5
  # Peak-ADU level treated as saturated: target → quality poor, comparison
  # stars → excluded from the zero-point ensemble.
  saturation_adu: 60000
  # Reject targets/comparison stars with a nearby peak at least 20% as bright.
  # This protects crowded fields from centroid mis-lock and aperture blending.
  blend_flux_fraction: 0.2
  blend_separation_fwhm: 1.25
  snr_threshold: 20
  solve_field_path: /opt/homebrew/bin/solve-field
  solver: astrometry
  survey_enabled: true
  survey_mag_limit: 17
  survey_match_radius_arcsec: 5
  survey_max_sources: 800
  survey_max_zp_scatter: 0.15
  survey_snr_min: 5
  target:
    dec_deg: null
    name: ''
    ra_deg: null
  # Zero-point ensemble scatter gates: above warn blocks quality=good,
  # above max forces quality=poor.
  zp_scatter_max: 0.3
  zp_scatter_warn: 0.15
pier_cam:
  bin: 2
  device_index: 0
  enabled: false
  exposure_ms: 80
  gain: 200
  jpeg_quality: 75
  sdk_lib: ''
  target_fps: 10
safety:
  dawn_type: astronomical
  disconnect_timeout: 600
  enabled: true
  heartbeat_interval: 30
  observer:
    latitude: 31.3614
    longitude: -99.4431
  park_at_dawn: true
  reconnect_attempts: 3
  reconnect_delay: 10
stacking:
  exposure_s: 10
  frames: 20
  preview_every: 1
telescope:
  slew_dec: 80.2692
  slew_ra: 23.6833
  tracking_rate: 0
