server {
    listen PORT_PLACEHOLDER;
    root /usr/share/nginx/html;
    index tour.html;

    # Node Agent installers are served by the API (302 → GitHub Releases).
    # Without this, try_files falls through to tour.html and the browser
    # just reloads the marketing page — "nothing happens."
    location /download/ {
        return 302 https://api.thetelescope.net$request_uri;
    }

    location / {
        try_files $uri $uri/ /tour.html;
    }
}
