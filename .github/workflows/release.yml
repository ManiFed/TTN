name: Release macOS installer

# Builds the node agent + the Flutter member app together and publishes the
# combined installer to GitHub Releases. This is the only path that produces
# a public download — running it on every version tag means the installer
# linked from tour.html / cloud/server.py can never drift out of sync with
# the app/cloud source the way the manually-built v1.0.4 release did.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.5)"
        required: true

permissions:
  contents: write

jobs:
  node-agent-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build PyInstaller bundle
        run: python build/build.py --bundle-only --skip-astap --clean
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-macos
          path: dist/TelescopeNetNode
          if-no-files-found: error

  flutter-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve app version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
      # Desktop runners may be generated in CI; keep any committed app/macos.
      - working-directory: app
        run: flutter create . --platforms=macos --project-name boundless_skies
      - working-directory: app
        run: |
          cat > macos/Runner/Configs/AppInfo.xcconfig <<'EOF'
          PRODUCT_NAME = TelescopeNet
          PRODUCT_BUNDLE_IDENTIFIER = org.telescopenet.app
          PRODUCT_COPYRIGHT = Copyright © 2026 The Telescope Net. All rights reserved.
          EOF
          cat > macos/Runner/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
          </dict>
          </plist>
          EOF
          if [ -f macos/Podfile ]; then
            sed -i.bak "s/platform :osx, '.*'/platform :osx, '10.15'/" macos/Podfile
          fi
          sed -i.bak -E 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]+/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i.bak 's/com.example.boundlessSkies/org.telescopenet.app/g' macos/Runner.xcodeproj/project.pbxproj
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: |
          flutter build macos --release \
            --dart-define=API_BASE=https://api.thetelescope.net \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }}
      - name: Stage macOS .app
        run: |
          SRC=""
          for candidate in \
            app/build/macos/Build/Products/Release/TelescopeNet.app \
            app/build/macos/Build/Products/Release/boundless_skies.app
          do
            if [ -d "$candidate" ]; then SRC="$candidate"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "No macOS .app found under Release/"; find app/build/macos -name '*.app' 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          rm -rf dist/TelescopeNet.app
          cp -R "$SRC" dist/TelescopeNet.app
          ditto -c -k --sequesterRsrc --keepParent dist/TelescopeNet.app dist/TelescopeNet-macos.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: telescopenet-macos
          path: dist/TelescopeNet-macos.app.zip
          if-no-files-found: error

  assemble-and-release:
    needs: [node-agent-macos, flutter-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: node-agent-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: telescopenet-macos
          path: dist
      - name: Assemble .pkg installer
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          chmod +x dist/TelescopeNetNode
          unzip -o dist/TelescopeNet-macos.app.zip -d dist
          FLUTTER_APP_SOURCE="dist/TelescopeNet.app" bash build/macos/build_dmg.sh
          # Stable-named copy so the download link never needs a code change
          cp "dist/TelescopeNetNode-${VERSION}-macOS.pkg" "dist/TelescopeNetNode-macOS.pkg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "dist/TelescopeNetNode-${VERSION}-macOS.pkg" \
            "dist/TelescopeNetNode-macOS.pkg" \
            --repo "${{ github.repository }}" \
            --title "Node Agent ${TAG}" \
            --generate-notes \
            --latest
