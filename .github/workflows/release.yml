name: Release macOS installer

# Builds the node agent + the Flutter member app together and publishes the
# combined installer to GitHub Releases. This is the only path that produces
# a public download.
#
# Runs automatically on every push to main that touches app/src/build code --
# NOT just on manually pushed tags. A hotfix session that fixed real bugs but
# forgot to also cut a release tag is exactly how a member re-downloaded the
# installer and got yesterday's build with none of the fixes: the source was
# right, nobody told the release pipeline to run. Auto-incrementing removes
# the "don't forget to tag" step entirely; workflow_dispatch/manual tags are
# still supported for an explicit version bump (e.g. a minor/major bump).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "src/**"
      - "build/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.1.0). Leave blank to auto-bump the patch version."
        required: false

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            if [[ -n "${{ inputs.tag }}" ]]; then
              TAG="${{ inputs.tag }}"
            else
              LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
              LATEST=${LATEST:-v0.0.0}
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            # Idempotent: covers both auto-bump and an explicit
            # workflow_dispatch tag input that doesn't exist yet.
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  node-agent-macos:
    needs: resolve-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build PyInstaller bundle
        run: python build/build.py --bundle-only --skip-astap --clean
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-macos
          path: dist/TelescopeNetNode
          if-no-files-found: error

  flutter-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
      # Desktop runners may be generated in CI; keep any committed app/macos.
      - working-directory: app
        run: flutter create . --platforms=macos --project-name boundless_skies
      - working-directory: app
        run: |
          cat > macos/Runner/Configs/AppInfo.xcconfig <<'EOF'
          PRODUCT_NAME = TelescopeNet
          PRODUCT_BUNDLE_IDENTIFIER = org.telescopenet.app
          PRODUCT_COPYRIGHT = Copyright © 2026 The Telescope Net. All rights reserved.
          EOF
          cat > macos/Runner/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
          </dict>
          </plist>
          EOF
          if [ -f macos/Podfile ]; then
            sed -i.bak "s/platform :osx, '.*'/platform :osx, '10.15'/" macos/Podfile
          fi
          sed -i.bak -E 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]+/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i.bak 's/com.example.boundlessSkies/org.telescopenet.app/g' macos/Runner.xcodeproj/project.pbxproj
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: |
          flutter build macos --release \
            --dart-define=API_BASE=https://api.thetelescope.net \
            --dart-define=APP_VERSION=${{ needs.resolve-version.outputs.version }}
      - name: Stage macOS .app
        run: |
          SRC=""
          for candidate in \
            app/build/macos/Build/Products/Release/TelescopeNet.app \
            app/build/macos/Build/Products/Release/boundless_skies.app
          do
            if [ -d "$candidate" ]; then SRC="$candidate"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "No macOS .app found under Release/"; find app/build/macos -name '*.app' 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          rm -rf dist/TelescopeNet.app
          cp -R "$SRC" dist/TelescopeNet.app
          ditto -c -k --sequesterRsrc --keepParent dist/TelescopeNet.app dist/TelescopeNet-macos.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: telescopenet-macos
          path: dist/TelescopeNet-macos.app.zip
          if-no-files-found: error

  assemble-and-release:
    needs: [resolve-version, node-agent-macos, flutter-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: node-agent-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: telescopenet-macos
          path: dist
      - name: Assemble .pkg installer
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          chmod +x dist/TelescopeNetNode
          unzip -o dist/TelescopeNet-macos.app.zip -d dist
          FLUTTER_APP_SOURCE="dist/TelescopeNet.app" bash build/macos/build_dmg.sh
          # Stable-named copy so the download link never needs a code change
          cp "dist/TelescopeNetNode-${VERSION}-macOS.pkg" "dist/TelescopeNetNode-macOS.pkg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "dist/TelescopeNetNode-${VERSION}-macOS.pkg" \
            "dist/TelescopeNetNode-macOS.pkg" \
            --repo "${{ github.repository }}" \
            --title "Node Agent ${TAG}" \
            --generate-notes \
            --latest
