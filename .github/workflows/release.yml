name: Release macOS installer

# Builds the node agent and publishes the installer to GitHub Releases. This is
# the only path that produces a public download.
#
# The Flutter member app is retired and is no longer built, signed or shipped:
# the interface is the chat page the node agent serves at localhost:5173/chat,
# plus whichever AI assistant the member already uses.
#
# Runs automatically on every push to main that touches app/src/build code --
# NOT just on manually pushed tags. A hotfix session that fixed real bugs but
# forgot to also cut a release tag is exactly how a member re-downloaded the
# installer and got yesterday's build with none of the fixes: the source was
# right, nobody told the release pipeline to run. Auto-incrementing removes
# the "don't forget to tag" step entirely; workflow_dispatch/manual tags are
# still supported for an explicit version bump (e.g. a minor/major bump).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "src/**"
      - "build/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.1.0). Leave blank to auto-bump the patch version."
        required: false

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            if [[ -n "${{ inputs.tag }}" ]]; then
              TAG="${{ inputs.tag }}"
            else
              LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
              LATEST=${LATEST:-v0.0.0}
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            # Idempotent: covers both auto-bump and an explicit
            # workflow_dispatch tag input that doesn't exist yet.
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  node-agent-macos:
    needs: resolve-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build PyInstaller bundle
        run: python build/build.py --bundle-only --clean
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-macos
          path: dist/TelescopeNetNode
          if-no-files-found: error

  assemble-and-release:
    needs: [resolve-version, node-agent-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: node-agent-macos
          path: dist
      - name: Assemble .pkg installer
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          chmod +x dist/TelescopeNetNode
          bash build/macos/build_dmg.sh
          # Stable-named copy so the download link never needs a code change
          cp "dist/TelescopeNetNode-${VERSION}-macOS.pkg" "dist/TelescopeNetNode-macOS.pkg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "dist/TelescopeNetNode-${VERSION}-macOS.pkg" \
            "dist/TelescopeNetNode-macOS.pkg" \
            --repo "${{ github.repository }}" \
            --title "Node Agent ${TAG}" \
            --generate-notes \
            --latest
