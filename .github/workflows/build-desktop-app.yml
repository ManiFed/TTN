name: Build desktop app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-desktop-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build-desktop-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-2022
            target: windows
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
      # Desktop runners may be generated in CI; keep any committed app/macos.
      - working-directory: app
        run: flutter create . --platforms=${{ matrix.target }} --project-name boundless_skies
      - if: matrix.target == 'macos'
        working-directory: app
        run: |
          # Product name + bundle id for the member control surface
          cat > macos/Runner/Configs/AppInfo.xcconfig <<'EOF'
          PRODUCT_NAME = TelescopeNet
          PRODUCT_BUNDLE_IDENTIFIER = org.telescopenet.app
          PRODUCT_COPYRIGHT = Copyright © 2026 The Telescope Net. All rights reserved.
          EOF
          # Network access for cloud API + local node agent
          cat > macos/Runner/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
          </dict>
          </plist>
          EOF
          if [ -f macos/Podfile ]; then
            sed -i.bak "s/platform :osx, '.*'/platform :osx, '10.15'/" macos/Podfile
          fi
          sed -i.bak -E 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]+/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i.bak 's/com.example.boundlessSkies/org.telescopenet.app/g' macos/Runner.xcodeproj/project.pbxproj
      - working-directory: app
        run: flutter pub get
      # Dart tests were unreachable until app/test/ came out of .gitignore.
      # Runs on every target so a platform-specific failure cannot hide.
      - name: Flutter tests
        working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build ${{ matrix.target }} --release --dart-define=API_BASE=https://api.thetelescope.net
        env:
          CMAKE_GENERATOR: ${{ matrix.target == 'windows' && 'Visual Studio 17 2022' || '' }}
      - if: matrix.target == 'macos'
        name: Stage macOS .app
        run: |
          # Flutter product name may be TelescopeNet or boundless_skies depending on config.
          SRC=""
          for candidate in \
            app/build/macos/Build/Products/Release/TelescopeNet.app \
            app/build/macos/Build/Products/Release/boundless_skies.app
          do
            if [ -d "$candidate" ]; then SRC="$candidate"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "No macOS .app found under Release/"; find app/build/macos -name '*.app' 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          # Normalize name for the installer
          rm -rf dist/TelescopeNet.app
          cp -R "$SRC" dist/TelescopeNet.app
          ditto -c -k --sequesterRsrc --keepParent dist/TelescopeNet.app dist/TelescopeNet-macos.app.zip
          ls -lh dist/
      - if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: telescopenet-macos
          path: dist/TelescopeNet-macos.app.zip
          if-no-files-found: error
      - if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: telescopenet-windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
      - if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: telescopenet-linux
          path: app/build/linux/**/release/bundle/
          if-no-files-found: error
