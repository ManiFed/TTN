name: Build desktop app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-desktop-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build-desktop-app.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
      # The repository retains the Flutter iOS runner for parity comparison
      # while desktop project runners are generated deterministically in CI.
      - working-directory: app
        run: flutter create . --platforms=${{ matrix.target }}
      - if: matrix.target == 'macos'
        working-directory: app/macos
        run: |
          sed -i.bak "s/platform :osx, '.*'/platform :osx, '10.15'/" Podfile
          sed -i.bak -E 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]+/MACOSX_DEPLOYMENT_TARGET = 10.15/g' Runner.xcodeproj/project.pbxproj
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build ${{ matrix.target }} --release
