name: Test and scientific validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Cloud tests import PostgreSQL-backed modules; install both dependency
      # sets so collection matches the deployed API environment.
      - run: pip install -r requirements.txt -r cloud/requirements.txt pytest
      - name: Unit and reliability gauntlet
        run: make test
      - name: Scientific validation gates
        run: make validate
