name: Build attested node bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Test before packaging
        run: python -m pytest tests -q
      - name: Build platform bundle
        run: python build/build.py --bundle-only --skip-astap --clean
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = [p for p in Path("dist").iterdir() if p.is_file()]
          Path("dist/SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in sorted(files)
          ))
          PY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
