# The Telescope Net Node Agent — configuration
# Generated by the installer.  Edit via the dashboard at http://localhost:5173
# or by opening this file in a text editor.

alpaca:
  discovery_port: 32227
  discovery_timeout: 5
  api_version: 1
  default_server:
    address: ''          # left blank: auto-discovered from Seestar Station Mode
    port: 32323

devices:
  telescope:
    enabled: true
    device_number: 0
  camera:
    enabled: true
    device_number: 0
  focuser:
    enabled: false
    device_number: 0
  filterwheel:
    enabled: false
    device_number: 0
  covercalibrator:
    enabled: true
    device_number: 0

camera:
  exposure_duration: 10.0
  binning: 1

observatory:
  name: ''
  latitude: null          # auto-detected from IP on first cloud registration
  longitude: null
  elevation: 0.0
  telescope: ZWO Seestar S50
  instrument: ZWO Seestar S50 IMX462
  observer: ''

photometry:
  enabled: true
  node_id: ''             # set automatically after cloud registration
  filter_name: CV
  gain: 1.0
  read_noise: 5.0
  target:
    name: ''
    ra_deg: null
    dec_deg: null
  solver: astap           # astap | astrometry (Astrometry.net solve-field)
  astap_path: astap       # bundled with the Node Agent; no separate install needed
  solve_field_path: solve-field
  force_plate_solve: false  # re-solve each stack, discarding any onboard WCS
  # Hardware-derived parameters ship unset: ALPACA autodetection and the
  # telescope spec catalog fill them at connect time, and after ~25 solved
  # frames the node reports its own *measured* pixel scale / FOV / limiting
  # magnitude to the registry (self-characterization). Set explicit values
  # only to override what the rig measures about itself.
  pixel_scale: null         # arcsec/px (autodetected; needed early only for the pointing-WCS fallback)
  field_radius: null        # deg (autodetected from optics)
  mag_limit: null           # faintest comparison star (autodetected from optics)
  mag_min: 10.0             # skip stars brighter than this — likely saturated
  astap_search_radius: 10
  aperture_factor: 1.5
  annulus_inner: 4.0
  annulus_outer: 6.0
  comparison_catalogs: [aavso, apass, gaia]  # queried in order until enough found
  comparison_target_count: 8
  min_comparison_stars: 3
  snr_threshold: 20
  max_uncertainty: 0.3
  max_airmass: 3.0
  # Open Aperture full-frame survey: measure every catalog-matched star in
  # every frame and stream compact source lists to the cloud.
  survey_enabled: true
  survey_snr_min: 5
  survey_max_sources: 800
  survey_max_zp_scatter: 0.15
  survey_match_radius_arcsec: 5
  fits_export:
    enabled: true
    export_dir: fits_export

aavso:
  observer_code: ''
  username: ''
  password: ''
  audit_dir: aavso_submissions
  dry_run: true
  submit_poor_quality: false
  chart_id: ''

cloud:
  enabled: true
  url: 'https://api.thetelescope.net'
  realtime_url: 'https://realtime.thetelescope.net'  # SSE push gateway (blank = poll only)
  activation_code: ''
  node_id: ''             # set automatically after first registration
  api_key: ''             # set automatically after first registration
  heartbeat_interval: 60
  heartbeat_fast_interval: 5     # fast cadence while observing (dark/exposing)
  plan_poll_interval: 300
  auto_run_plans: true    # execute cloud observation plans automatically
  upload_images: false
  disconnect_park_timeout: 1800  # park if cloud heartbeat fails this long (0 = disabled)

image_watcher:
  enabled: true
  watch_path: ''          # set automatically when Seestar is connected
  debounce_delay: 2.0

safety:
  enabled: true
  disconnect_timeout: 600
  heartbeat_interval: 30
  reconnect_attempts: 3
  reconnect_delay: 10
  park_at_dawn: true
  dawn_type: astronomical
  observer:
    latitude: 0.0
    longitude: 0.0

logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
