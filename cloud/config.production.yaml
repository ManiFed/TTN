server:
  host: 0.0.0.0
  port: 8800
  admin_key: '${CLOUD_ADMIN_KEY}'
  # Read-only admin credential for monitoring (the nightly fleet
  # patrol in CI). Accepted by GET-only admin endpoints; never by
  # anything that replans, rolls back, or touches AAVSO batches.
  admin_readonly_key: '${CLOUD_ADMIN_READONLY_KEY}'

database:
  url: '${DATABASE_URL}'

light_pollution:
  api_key: '${LIGHT_POLLUTION_API_KEY}'

alerts:
  interval_minutes: 60
  expire_days: 45
  alerce:
    enabled: true
    mag_limit: 16.0
    days_back: 14
  gaia:
    enabled: true
    mag_limit: 16.0
    days_back: 30
  tns:
    enabled: true
    api_key: '${TNS_API_KEY}'
    bot_id: '${TNS_BOT_ID}'
    bot_name: '${TNS_BOT_NAME}'
    mag_limit: 16.5
    days_back: 7
  atlas:
    enabled: true
    mag_limit: 16.5
    username: '${ATLAS_USERNAME}'
    password: '${ATLAS_PASSWORD}'
  asassn:
    enabled: true
    mag_limit: 16.5
    api_key: '${ASASSN_API_KEY}'
  aavso:
    enabled: true
    default_watchlist: true
    vsx_names: []
  tess:
    enabled: true
    mag_limit: 12.0
    min_depth_ppt: 5.0
    max_duration_hours: 4.0

scoring:
  weights:
    brightness: 0.20
    science: 0.25
    time: 0.15
    coverage: 0.15
    observe: 0.25
    roi: 0.10
  observability_weights:
    light_pollution: 0.20
    weather: 0.25
    moon: 0.15
    airmass: 0.15
    window: 0.15
    telescope: 0.10

tuning:
  enabled: false
  api_key: '${ANTHROPIC_API_KEY}'
  model: claude-sonnet-4-6
  lookback_nights: 14
  max_delta: 0.05
  min_nights_data: 7
  min_measurements: 30
  min_change: 0.005

help:
  openrouter_api_key: '${OPENROUTER_API_KEY}'
  model: anthropic/claude-haiku-4.5

scheduler:
  chorus: true
  chorus_shadow: false
  network_optimizer: false
  local_search_ms: 1500
  replan_interval_minutes: 120
  # Live fleet: mid-night reflow of a clouded-out node's unexecuted plan
  # items onto currently-dark nodes. reflow.tick runs only on the API
  # service (the loop that dispatches interrupts); the solver-worker never
  # touches this.
  reflow: true
  reflow_interval_s: 60
  reflow_max_per_night: 200
  reflow_streak_threshold: 2
  reflow_streak_eps_relax: 0.5
  reflow_auto_grade: true
  reflow_grad_start_cap: 5
  reflow_grad_min_nights: 3
  reflow_grad_min_delivery_rate: 0.7
  reflow_grad_lookback_nights: 14
  reflow_grad_step_factor: 2.0
  min_score: 0.25
  max_targets_per_night: 12
  contingency_ladder_size: 10
  topup_items_per_tick: 3
  sun_altitude_limit: -12
  chorus_params:
    scarcity_gamma: 0.93
    exploration_beta: 0.15
    same_site_repeat_factor: 0.25
    weather_corr_radius_km: 50.0

aavso:
  observer_code: 'EGBA'
  username: '${AAVSO_USERNAME}'
  password: '${AAVSO_PASSWORD}'
  chart_id: ''
  dry_run: false
  batch_interval_minutes: 360
  single_node_holdback_hours: 6
  audit_dir: /data/aavso_batches

storage:
  raw_image_dir: /data/raw_images
  raw_image_retention_days: 14
  max_image_mb: 64

calibration_mesh:
  enabled: true
  apply_qualified: false
  max_frame_zp_scatter: 0.15
  min_samples: 500
  min_stars: 50
  min_nights: 5
  min_overlap_nodes: 3
  min_color_span: 1.0
  min_airmass_span: 0.8
  standard_rms: 0.03
  cv_rms: 0.05
  min_improvement: 0.10
  max_color_slope: 0.02
  passes_to_qualify: 3
  family_prior_samples: 100
  calibration_debt_enabled: false
  debt_after_photometric_nights: 30
  max_fields_per_week: 2
  standard_fields: []

autonomy:
  enabled: false
  private_key: '${AUTONOMY_SIGNING_KEY}'
  signing_key_id: primary
  max_items: 50
  max_exposure_s: 43200
  max_slews: 50
  max_storage_bytes: 21474836480

# The separate railway.gcn.toml worker consumes in shadow mode first. Enabling
# live dispatch is an independent operator action after replay acceptance.
gcn:
  enabled: true
  run_embedded: false
  client_id: '${GCN_CLIENT_ID}'
  client_secret: '${GCN_CLIENT_SECRET}'
  domain: gcn.nasa.gov
  schema_registry: ''
  heartbeat_stale_s: 120
  live_dispatch: false
  observe_unknown_sources: false
  max_online_node_fraction: 0.20
  max_node_hours_per_event: 50
  galaxy_weight_fraction: 0.70
  task_expiry_hours: 6
  grb_max_age_hours: 6
  lvk_min_has_ns: 0.10
  lvk_max_area_deg2: 2000
  icecube_min_p_astro: 0.50
  grb_max_area_deg2: 500
  frb_max_radius_deg: 0.50
  default_filter: CV
  topics:
    - igwn.gwalert
    - gcn.notices.icecube.lvk_nu_track_search
    - gcn.notices.icecube.gold_bronze_track_alerts
    - gcn.classic.text.FERMI_GBM_ALERT
    - gcn.classic.text.FERMI_GBM_FLT_POS
    - gcn.classic.text.FERMI_GBM_GND_POS
    - gcn.classic.text.FERMI_GBM_FIN_POS
    - gcn.notices.swift.bat.guano
    - gcn.classic.text.SWIFT_BAT_GRB_POS_ACK
    - gcn.notices.chime.frb
    - gcn.notices.superk.sn_alert
    - gcn.classic.text.SNEWS

# Asteroid/minor-planet astrometry: link unmatched survey detections into
# moving-object tracklets, crossmatch against known objects (SkyBoT), and
# generate MPC-format reports for manual submission once an observatory code
# is registered.
mpc:
  enabled: false                 # gate report generation until an observatory code exists
  observatory_code: ''           # assigned by MPC after manual site registration
  observer_name: ''
  min_detection_snr: 5.0
  skybot_radius_arcsec: 30
  link_window_hours: 6
  link_max_field_sep_deg: 2.0
  min_track_detections: 3
  max_fit_residual_arcsec: 5.0
  link_retry_hours: 12
  detection_retention_days: 30
  arc_link_window_days: 14
  arc_max_pred_resid_arcsec: 20
  report_dir: /data/mpc_reports
  neo_rate_threshold_deg_day: 2.0
  neo_alert_n_nodes: 2
  neo_alert_expires_hours: 1.5
  comet_extended_fraction: 0.6
  rotation_followup:
    enabled: false
    n_visits: 4
    interval_hours: 1.5
    expires_hours: 0.75

# Universal frame ingestion: cloud plate solving. Runs only on the solver-worker
# service (python -m cloud.ingest_worker), which has the astrometry.net
# index volume mounted at /data/astrometry (see Dockerfile.solver). The
# local index covers common consumer-telescope fields of view; frames
# outside that range fall back to nova.astrometry.net.
solver:
  solve_field_path: solve-field
  search_radius_deg: 15
  timeout_s: 180
  web_fallback: true
  web_api_key: '${ASTROMETRY_API_KEY}'
  web_timeout_s: 300

logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
