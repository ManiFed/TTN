server:
  host: 0.0.0.0
  port: 8800
  admin_key: '${CLOUD_ADMIN_KEY}'  # secret — set in the environment
  # Read-only admin credential for monitoring (the nightly fleet
  # patrol in CI). Accepted by GET-only admin endpoints; never by
  # anything that replans, rolls back, or touches AAVSO batches.
  admin_readonly_key: '${CLOUD_ADMIN_READONLY_KEY}'

database:
  url: 'postgresql://boundless@/boundless?host=/tmp'  # local Homebrew PostgreSQL

light_pollution:
  api_key: ''              # lightpollutionmap.info key; blank = default 20.0 mpsas

alerts:
  interval_minutes: 60
  expire_days: 45          # deactivate transients unseen by any source this long
  alerce:
    enabled: true
    mag_limit: 16.0
    days_back: 14
  gaia:
    enabled: true
    mag_limit: 16.0
    days_back: 30
  tns:
    enabled: true          # silently skipped until api_key + bot_id are set
    api_key: ''
    bot_id: ''
    bot_name: ''
    mag_limit: 16.5
    days_back: 7
  atlas:
    enabled: true
    mag_limit: 16.5
    username: ''          # register free at https://star.pst.qub.ac.uk/sne/atlas4/
    password: ''          # skipped automatically when blank
  asassn:
    enabled: true
    mag_limit: 16.5
    api_key: ''           # register free at https://asas-sn.osu.edu/sky-patrol/
                          # skipped automatically when blank
  aavso:
    enabled: true
    default_watchlist: true
    vsx_names: []          # extra VSX identifiers to keep on the programme
  tess:
    enabled: true
    mag_limit: 12.0         # host-star V mag; Seestar S50 needs V < 12 for photometry
    min_depth_ppt: 5.0      # minimum transit depth in ppt (5 ppt = 5 mmag)
    max_duration_hours: 4.0 # skip transits longer than 4 h (don't fit one night)

scoring:
  weights:                 # relative importance of composite components
    brightness: 0.20
    science: 0.25
    time: 0.15
    coverage: 0.15
    observe: 0.25
    roi: 0.10
  observability_weights:   # seed only — auto-tuned live values live in the DB
    light_pollution: 0.20
    weather: 0.25
    moon: 0.15
    airmass: 0.15
    window: 0.15
    telescope: 0.10
  slot_quality_weights:    # time-resolved within-night placement (network optimizer)
    altitude: 0.35         # airmass / how high the target rides at this slot
    cloud: 0.20            # per-slot clear-sky fraction
    seeing: 0.15           # per-slot atmospheric steadiness
    transparency: 0.10     # per-slot extinction
    moon: 0.10             # per-slot moon separation × illumination
    sky_brightness: 0.05
    thermal: 0.05          # uncooled-camera penalty on faint targets

help:
  # Member help chat (OpenRouter → Claude Haiku 4.5). Set OPENROUTER_API_KEY
  # in the environment or here. Rate-limited to 5 user messages per week.
  openrouter_api_key: ''
  model: anthropic/claude-haiku-4.5

tuning:
  # Nightly Claude monitor that reviews observing outcomes and adjusts the
  # scheduler's tunable parameter groups: composite weights, observability
  # sub-weights, slot-quality weights, and network coordination knobs. The hot
  # path (ingestion, scoring, scheduling) stays 100% procedural; Claude is
  # advisory only. Ships OFF — behavior is unchanged until an operator opts in.
  # See cloud/tuning.py.
  enabled: false
  api_key: ''                # blank → falls back to ANTHROPIC_API_KEY env var
  model: claude-opus-4-8     # latest Opus; set claude-sonnet-4-6 to cut cost
  lookback_nights: 14        # how many nights of outcomes to summarize
  max_delta: 0.05            # hard cap on per-run change to any single weight
  max_delta_coord: 0.15      # hard cap on per-run fractional change to a coord knob
  min_nights_data: 7         # don't tune until this many nights of data exist
  min_measurements: 30       # ...and not until this many measurements exist
  min_change: 0.005          # skip apply/notify if no weight moves more than this

scheduler:
  # Planner selection:
  #   chorus: true            → CHORUS information-theoretic coordinator (CHORUS.md)
  #   network_optimizer: true → previous marginal-value fleet optimizer, only
  #                             used when chorus is explicitly false
  # The former per-node greedy slot-packer lives in cloud/archive/.
  # chorus_shadow runs the full CHORUS pipeline alongside the incumbent for
  # telemetry + the tuning backtest archive WITHOUT saving plans — the staged
  # rollout path (shadow first, then flip chorus on once plan_runs comparisons
  # look good; set chorus: false for instant rollback at any time).
  chorus: true
  chorus_shadow: false
  network_optimizer: false # CHORUS is the live planner
  local_search_ms: 1500    # annealing refinement budget per network run
  replan_interval_minutes: 120
  # Live fleet: mid-night reflow. When a node clouds out/drops offline with
  # unexecuted plan items, re-value them on currently-dark nodes (reusing
  # CHORUS best_slot) and dispatch as interrupts. Also tops up work-starved
  # nodes that ran out of plan + alternates with dark time remaining.
  reflow: true
  reflow_interval_s: 60
  reflow_max_per_night: 200      # the ceiling reflow_auto_grade escalates toward
  reflow_streak_threshold: 2     # consecutive prior dark nights before a dropout counts as chronic
  reflow_streak_eps_relax: 0.5   # multiplies the greedy step's min-marginal floor for chronic dropouts
  reflow_auto_grade: true              # graduated rollout instead of a static nightly cap
  reflow_grad_start_cap: 5             # tonight's cap while reflow is still unproven
  reflow_grad_min_nights: 3            # clean nights of reconciled history per escalation step
  reflow_grad_min_delivery_rate: 0.7   # trailing delivered/(delivered+missed) required to hold/escalate
  reflow_grad_lookback_nights: 14      # trailing window reconcile history is measured over
  reflow_grad_step_factor: 2.0         # cap multiplier per escalation step
  min_score: 0.25          # targets below this never get scheduled
  max_targets_per_night: 12
  # Never-idle knobs: how many runnable alternates ship with each plan (node-
  # local gap/failure/end-of-plan fill) and how many items a reflow top-up
  # sends a work-starved node per tick.
  contingency_ladder_size: 10
  topup_items_per_tick: 3
  sun_altitude_limit: -12  # nautical darkness
  coordination:            # seed only — auto-tuned live values live in the DB
    redundancy_decay: 0.55           # value retained per extra network obs of a target
    redundancy_diversity_sep: 90.0   # longitude sep (deg) for full diversity credit
    cadence_bonus_strength: 1.0      # 0 = ignore cadence, 1 = full cadence shaping
    slew_cost_weight: 1.0
    slew_deg_per_s: 3.0
    slew_settle_s: 15.0
    filter_change_cost_s: 60.0
    meridian_flip_cost_s: 120.0
    preferred_target_boost: 0.10
    robustness_cloud_relax: 0.20     # cloud-cutoff relaxation for enclosure/dew nodes
    slot_quality_floor: 0.50
    local_search_aggressiveness: 1.0
  chorus_params:           # seed only — CHORUS hyperparameters (tuning group
                           # "chorus"); full key list + bounds in cloud/chorus/params.py.
                           # Auto-tuned live values live in the DB, and changes are
                           # gated by the deterministic backtest replay (CHORUS.md §7).
    scarcity_gamma: 0.93             # nightly discount on future capture chances
    exploration_beta: 0.15           # value of learning about new/uncertain nodes
    same_site_repeat_factor: 0.25    # weather-correlation conservatism
    weather_corr_radius_km: 50.0     # ground distance treated as sharing a sky with a same-node repeat

aavso:
  observer_code: 'EGBA'
  # Secrets are expanded from the environment by load_config() — never commit them.
  username: '${AAVSO_USERNAME}'
  password: '${AAVSO_PASSWORD}'
  chart_id: ''
  dry_run: false
  batch_interval_minutes: 360
  single_node_holdback_hours: 6
  audit_dir: cloud_data/aavso_batches

storage:
  raw_image_dir: cloud_data/raw_images
  raw_image_retention_days: 14
  max_image_mb: 64

# Open Aperture full-frame survey: ingest bounds, deviation-detection
# thresholds, and retention for raw survey rows (Welford aggregates in
# survey_sources are permanent).
survey:
  max_sources_per_batch: 800
  retention_days: 120
  deviants_per_node_night: 50
  bootstrap_min_delta_mag: 1.0     # vs catalog, n_obs < baseline_min_n
  bootstrap_min_sigma: 5.0
  baseline_min_n: 5                # own-baseline phase starts here
  baseline_min_z: 5.0
  baseline_min_delta_mag: 0.3
  new_source_min_snr: 10.0
  variable_suspect_stdev: 0.2      # own-scatter above this → survey science, not alerts
  crossmatch_radius_arcsec: 10.0   # VSX/TNS cone match for candidates
  historical_days: 7               # contributed frames older than this → retro path
  posterior_snr_scale: 8.0         # SNR at which one node's false-positive-survival
                                   # probability is exp(-1) — see _posterior_confidence
  # Live fleet: reflex confirmation. On candidate promotion, task other dark
  # nodes to confirm within seconds instead of waiting for the nightly replan.
  reflex:
    enabled: true
    max_per_night_global: 30       # ceiling on autonomous confirmations/night
    max_per_candidate: 1
    min_peak_delta_mag: 0.5        # only confirm meaningful brightness steps
    cooldown_min: 120              # per-source cooldown between reflex fires
    n_nodes: 3                     # confirming nodes per candidate
    expires_hours: 2

# Network-wide photometric response calibration. Candidate models are learned
# by default but never alter exports until apply_qualified is explicitly set.
calibration_mesh:
  enabled: true
  apply_qualified: false
  max_frame_zp_scatter: 0.15
  min_samples: 500
  min_stars: 50
  min_nights: 5
  min_overlap_nodes: 3
  min_color_span: 1.0
  min_airmass_span: 0.8
  standard_rms: 0.03
  cv_rms: 0.05
  min_improvement: 0.10
  max_color_slope: 0.02
  passes_to_qualify: 3
  calibration_debt_enabled: false
  debt_after_photometric_nights: 30
  max_fields_per_week: 2
  family_prior_samples: 100
  # Operator-vetted standard fields: [{name,ra_deg,dec_deg,filter,color_span,
  # leverage:[color,airmass],expDur,expCount}]. No field is invented by code.
  standard_fields: []

# Signed disconnected-night bundles. Disabled until a base64-encoded raw
# Ed25519 private key is supplied through AUTONOMY_SIGNING_KEY.
autonomy:
  enabled: false
  private_key: ${AUTONOMY_SIGNING_KEY}
  signing_key_id: primary
  max_items: 50
  max_exposure_s: 43200
  max_slews: 50
  max_storage_bytes: 21474836480

# Dedicated NASA GCN Kafka intake. Credentials are issued at gcn.nasa.gov.
# Intake may be enabled independently of live dispatch for safe shadow replay.
gcn:
  enabled: false
  run_embedded: false
  client_id: ${GCN_CLIENT_ID}
  client_secret: ${GCN_CLIENT_SECRET}
  domain: gcn.nasa.gov
  schema_registry: ""
  heartbeat_stale_s: 120
  live_dispatch: false
  observe_unknown_sources: false
  max_online_node_fraction: 0.20
  max_node_hours_per_event: 50
  galaxy_weight_fraction: 0.70
  task_expiry_hours: 6
  grb_max_age_hours: 6
  lvk_min_has_ns: 0.10
  lvk_max_area_deg2: 2000
  icecube_min_p_astro: 0.50
  grb_max_area_deg2: 500
  frb_max_radius_deg: 0.50
  default_filter: CV
  topics:
    - igwn.gwalert
    - gcn.notices.icecube.lvk_nu_track_search
    - gcn.notices.icecube.gold_bronze_track_alerts
    - gcn.classic.text.FERMI_GBM_ALERT
    - gcn.classic.text.FERMI_GBM_FLT_POS
    - gcn.classic.text.FERMI_GBM_GND_POS
    - gcn.classic.text.FERMI_GBM_FIN_POS
    - gcn.notices.swift.bat.guano
    - gcn.classic.text.SWIFT_BAT_GRB_POS_ACK
    - gcn.notices.chime.frb
    - gcn.notices.superk.sn_alert
    - gcn.classic.text.SNEWS

# Asteroid/minor-planet astrometry: link unmatched survey detections into
# moving-object tracklets, crossmatch against known objects (SkyBoT), and
# generate MPC-format reports for manual submission once an observatory code
# is registered.
mpc:
  enabled: false                 # gate report generation until an observatory code exists
  observatory_code: ''           # assigned by MPC after manual site registration
  observer_name: ''
  min_detection_snr: 5.0         # floor for keeping an unmatched detection
  skybot_radius_arcsec: 30
  link_window_hours: 6           # max time span for one single-night tracklet
  link_max_field_sep_deg: 2.0    # max sky separation to consider two detections/tracklets co-field
  min_track_detections: 3        # tracklet must have >=3 points before crossmatch
  max_fit_residual_arcsec: 5.0   # reject non-linear (spurious) tracks
  link_retry_hours: 12           # stop retrying an unlinked detection after this
  detection_retention_days: 30   # prune retired-noise / closed-tracklet detections
  arc_link_window_days: 14       # max gap between nights to fold into one multi-night arc
  arc_max_pred_resid_arcsec: 20  # looser than max_fit_residual_arcsec — motion curves over days
  report_dir: cloud_data/mpc_reports
  neo_rate_threshold_deg_day: 2.0   # on-sky rate above this → priority='neo_candidate'
  neo_alert_n_nodes: 2              # dark nodes to urgently re-task on a confirmed-unknown fast mover
  neo_alert_expires_hours: 1.5      # how long that urgent interrupt stays open
  comet_extended_fraction: 0.6      # fraction of a tracklet's detections flagged "extended" (see
                                    # src/photometry.py survey_comet_sharpness_drop) to call it a comet candidate
  rotation_followup:
    enabled: false                  # same-night repeat exposures of a confirmed asteroid for a rotation light curve
    n_visits: 4                     # follow-up exposures after confirmation
    interval_hours: 1.5             # spacing between visits
    expires_hours: 0.75             # how long each fired interrupt stays open

# Universal frame ingestion: cloud plate solving for contributed frames.
# Runs on the solver worker service (astrometry.net index volume). The web
# fallback (nova.astrometry.net) is for archive frames outside the local index.
solver:
  solve_field_path: solve-field
  search_radius_deg: 15
  timeout_s: 180
  web_fallback: false
  web_api_key: ${ASTROMETRY_API_KEY}
  web_timeout_s: 300

# Ingestion triage: cheap heuristic gate before the solver spends time. Rejects
# junk, stretched/non-linear, and star-trailed frames.
triage:
  enabled: true
  min_sources: 8
  max_saturated_frac: 0.02
  max_elongation: 1.8
  max_gradient_ratio: 6.0

logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
